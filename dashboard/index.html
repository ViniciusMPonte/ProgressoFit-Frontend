<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Fitness</title>

    <link href="../src/styles/bootstrap/bootstrap.css" rel="stylesheet">
    <link href="../src/styles/main.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="container-fluid user-area bg-primary">
            <div class="row align-items-center">
                <div class="col-sm-6 col-md-8">
                </div>
                <div class="col-6 col-md-4">
                </div>
            </div>
        </div>
    </header>
<main>
    <div class="chart-container">
        <h3>Treinos por Semana</h3>
        <canvas id="training-per-weekly-chart"></canvas>
    </div>


    <form id="dataForm">
        <div class="form-group">
            <label class="g-bold" for="dataField">Data</label><br>
            <input class="custom-date" type="date" id="dataField" name="data" required>
        </div>

        <div class="form-group">
            <p>Você definiu uma meta para essa dia, você realizou seu treino?</p>
            <button type="button" class="btn btn-danger" id="toggleButton">
                <span id="toggleLabel">☐ Não</span>
            </button>
        </div>
    </form>
</main>
</body>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
<script src="../src/app.js" type="module"></script>

</html>
