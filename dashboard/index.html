<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Fitness</title>

    <link href="../src/styles/bootstrap/bootstrap.css" rel="stylesheet">
    <link href="../src/styles/main.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Dashboard</h1>

<div class="chart-container">
    <h3>Treinos por Semana</h3>
    <canvas id="training-per-weekly-chart"></canvas>
</div>


<form id="dataForm">
    <div class="form-group">
        <label>Status:</label>
        <div class="toggle-container">
            <button type="button" class="toggle-switch" id="toggleButton">
                <div class="toggle-slider"></div>
            </button>
            <span class="toggle-label" id="toggleLabel">Desativado (0)</span>
        </div>
    </div>

    <div class="form-group">
        <label for="dataField">Data:</label>
        <input type="date" id="dataField" name="data" required>
    </div>

    <button type="submit">Enviar Dados</button>
</form>

<div id="status" class="status"></div>


</body>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
<script src="../src/app.js" type="module"></script>
</html>
