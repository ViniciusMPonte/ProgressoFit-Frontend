<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProgressoFit - Dashboard</title>
    <link rel="icon" type="image/x-icon" href="../src/assets/images/favicon.svg">

    <link href="../src/styles/bootstrap/bootstrap.css" rel="stylesheet" />
    <link href="../src/styles/main.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header class="bg-primary">
        <div class="section-top row g-0">


            <div class="col-xl-2 pe-4">
                <div id="avatar-container"></div>
            </div>
            <div class="col-xl-10 d-flex flex-column justify-content-between">
                <h1 id="userName" class="text-white"></h1>


                <div id="cards-hero-container" class="row">
                    <div class="col-md-4">
                        <div class="card d-flex flex-row align-items-center p-3">
                            <i class="fa-solid fa-rotate fa-2xl me-3"></i>
                            <div class="d-flex flex-column">
                                <span class="g-bold">Último Registro</span>
                                <span id="lastUpdate">&nbsp;</span>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card d-flex flex-row align-items-center p-3">
                            <i class="fa-solid fa-weight-scale fa-2xl me-3"></i>
                            <div class="d-flex flex-column">
                                <span class="g-bold">Peso Atual</span>
                                <span id="currentWeight">Nenhuma meta registrada</span>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card d-flex flex-row align-items-center p-3">
                            <i class="fa-solid fa-fire fa-2xl me-3"></i>
                            <div class="d-flex flex-column">
                                <span class="g-bold">Streak Atual</span>
                                <span id="currentStreak">Nenhuma meta registrada</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main>
            <div class="row row-gap-3">
                <div class="col-lg-8">
                    <div class="card h-100 d-flex flex-column justify-content-center">
                        <div class="chart-container">
                            <h3 class="g-bold">Treinos por Semana</h3>
                            <canvas id="training-per-weekly-chart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 d-flex flex-column row-gap-3">
                    <div id="training-per-weekly-interface"></div>
                    <div id="training-per-weekly-goal" class="h-100"></div>
                </div>
            </div>

            <div class="row mt-4 row-gap-3">
                <div class="col-lg-8">
                    <div class="card h-100 d-flex flex-column justify-content-center">
                        <div class="chart-container">
                            <h3 class="g-bold">Peso por Semana</h3>
                            <canvas id="weight-daily-weekly-chart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 d-flex flex-column row-gap-3">
                    <div id="weight-per-weekly-interface"></div>
                    <div id="weight-per-weekly-goal" class="h-100"></div>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
            crossorigin="anonymous"
        ></script>
        <script src="https://apifreellm.com/apifree.min.js"></script>
        <script src="../src/app.js" type="module"></script>
    </body>
</html>
