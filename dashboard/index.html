<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Fitness</title>

    <link href="../src/styles/bootstrap/bootstrap.css" rel="stylesheet" />
    <link href="../src/styles/main.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header class="bg-primary">
        <div class="section-top row g-0" style="top: 125px;">
            <div class="col-2 d-flex align-items-end justify-content-center" style="position: relative">
                <div id="avatar-container"></div>
            </div>
            <div class="col-10 d-flex align-items-end">
                <h1 id="userName" class="text-white"></h1>
            </div>
            <div class="col-2"></div>
            <div class="col-10" style="margin-top: 25px;">
                <div class="row">
                    <div class="col-4">
                        <div class="card"
                            style="display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 20px;">
                            <i class="fa-solid fa-ruler fa-2xl"></i>
                            <div style="display: flex; flex-direction: column;">
                                <span class="g-bold">Minha Altura</span>
                                <span id="currentWeight">1.80 m</span>
                            </div>
                        </div>
                    </div>

                    <div class="col-4">
                        <div class="card"
                            style="display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 20px;">
                            <i class="fa-solid fa-weight-scale fa-2xl"></i>
                            <div style="display: flex; flex-direction: column;">
                                <span class="g-bold">Peso Atual</span>
                                <span id="currentWeight">60 kg</span>
                            </div>
                        </div>
                    </div>

                    <div class="col-4">
                        <div class="card"
                            style="display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 20px;">
                            <i class="fa-solid fa-fire fa-2xl"></i>
                            <div style="display: flex; flex-direction: column;">
                                <span class="g-bold">Streak Atual</span>
                                <span id="currentWeight">7 dias</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main>
        <div class="row">
            <div class="col-lg-8">
                <div class="card">
                    <div class="chart-container">
                        <h3 class="g-bold">Gráfico de Desempenho - Mensal</h3>
                        <canvas id="training-per-weekly-chart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div id="training-per-weekly-interface" class="card"></div>
            </div>

        </div>

        <div class="row mt-4">
            <div class="col-lg-8">

                <div class="card">
                    <div class="chart-container">
                        <h3 class="g-bold">Gráfico de peso - Mensal</h3>
                        <canvas id="weight-daily-weekly-chart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 d-flex align-items-start">
                <div class="card w-100">
                    <form id="weightForm">
                        <div class="card-header" style="display: flex; align-items: center; gap: 10px;">
                            <i class="fa-solid fa-weight-scale fa-2xl"></i>
                            <div style="display: flex; flex-direction: column;">
                                <label class="g-bold" for="weightDateField">Data</label>
                                <input class="custom-date" type="date" id="weightDateField" name="weightDate"
                                    required />
                            </div>
                        </div>
                        <div class="form-group" style="margin-top: 10px;">
                            <label class="g-bold" for="weightInput">Peso (kg)</label>
                            <input type="number" step="0.1" id="weightInput" name="weight" placeholder="Digite seu peso"
                                required />
                        </div>
                        <button type="submit" class="btn btn-primary" style="margin: 10px;">Salvar Peso</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="../src/app.js" type="module"></script>
</body>

</html>
