<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Fitness</title>

    <link href="../src/styles/bootstrap/bootstrap.css" rel="stylesheet" />
    <link href="../src/styles/main.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
        <div class="section-top bg-primary" style="height: 200px; position: relative"></div>
            <div class="row justify-content-center">
                <div class="col-3 d-flex align-items-end justify-content-center">
                    <img class="avatar-fixo" src="../src/assets/images/avatar-vinicius.png" width="250" height="250" alt="Avatar do Usuário">
                </div>
                <div class="col-9">
                    
                </div>
            </div>
    </header>
    <main>
    <div class="row">
        <div class="col-lg-8">
          <div class="chart-container">
              <h3>Treinos por Semana</h3>
              <canvas id="training-per-weekly-chart"></canvas>
            </div>
        </div>
        <div class="col-lg-4">
          <form id="dataForm">
              <div class="form-group">
                  <label class="g-bold" for="dataField">Data</label><br>
                  <input class="custom-date" type="date" id="dataField" name="data" required>
              </div>

              <div class="form-group">
                  <p>Você definiu uma meta para essa dia, você realizou seu treino?</p>
                  <button type="button" class="btn btn-danger" id="toggleButton">
                      <span id="toggleLabel">☐ Não</span>
                  </button>
              </div>
          </form>
        </div>
        <div class="col-lg-8">
            <div class="chart-container">
                <h3>Peso por Semana</h3>
                <canvas id="weight-daily-weekly-chart"></canvas>
            </div>
        </div>
    </div>
</main>
</body>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"
  ></script>
  <script src="../src/app.js" type="module"></script>
</html>
