<h1>Dashboard</h1>

<div class="chart-container">
    <h3>Treinos por Semana</h3>
    <canvas id="training-per-weekly-chart"></canvas>
</div>


<form id="dataForm">
    <div class="form-group">
        <label>Status:</label>
        <div class="toggle-container">
            <button type="button" class="toggle-switch" id="toggleButton">
                <div class="toggle-slider"></div>
            </button>
            <span class="toggle-label" id="toggleLabel">Desativado (0)</span>
        </div>
    </div>

    <div class="form-group">
        <label for="dataField">Data:</label>
        <input type="date" id="dataField" name="data" required>
    </div>

    <button type="submit">Enviar Dados</button>
</form>

<div id="status" class="status"></div>


</body>
