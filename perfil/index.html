<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgressoFit - Perfil</title>

    <link href="../src/styles/bootstrap/bootstrap.css" rel="stylesheet">
    <link href="../src/styles/main.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <form id="profileForm">

            <h1 class="h3 mb-3 fw-normal">Meu Perfil</h1>

            <div class="form-floating">
                <input type="text" class="form-control-plaintext" id="floatingName" readonly>
                <label for="floatingName">Nome</label>
            </div>

            <div class="form-floating">
                <input type="email" class="form-control-plaintext" id="floatingEmail" readonly>
                <label for="floatingEmail">E-mail</label>
            </div>

            <div class="form-floating">
                <input type="password" class="form-control-plaintext" id="floatingPassword" readonly>
                <label for="floatingPassword">Senha</label>
            </div>

            <button class="btn btn-primary" type="button" id="editButton">
                Editar Perfil
            </button>

            <button class="btn btn-success d-none" type="button" id="saveButton">
                Salvar
            </button>

            <button class="btn btn-danger d-none" type="button" id="cancelButton">
                Cancelar
            </button>

            <div id="loading" class="d-none mt-3">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
            </div>

            <p class="mt-5 mb-3 text-muted" id="footer"></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="../src/app.js" type="module"></script>
</body>

</html>
